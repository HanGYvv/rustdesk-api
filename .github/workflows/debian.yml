name: debian

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to build, for example v1.2.3.
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "20"

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-22.04
    outputs:
      release-tag: ${{ steps.version.outputs.release-tag }}
      release-version: ${{ steps.version.outputs.release-version }}

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          version="${tag#v}"

          if [[ ! "${tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi

          echo "release-tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release-version=${version}" >> "${GITHUB_OUTPUT}"

  build-linux:
    name: Build Linux - ${{ matrix.job.name }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64", platform: "amd64", goarch: "amd64", file_ext: "tar.gz" }
          - { name: "arm64v8", platform: "arm64", goarch: "arm64", file_ext: "tar.gz" }
          - { name: "armv7", platform: "armv7l", goarch: "arm", file_ext: "tar.gz" }

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-tag }}
          path: source

      - name: Read Go version
        id: go-version
        working-directory: source
        run: |
          version="$(sed -n 's/^toolchain go//p' go.mod | head -n 1)"
          if [ -z "${version}" ]; then
            echo "Unable to determine Go version from go.mod" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache-dependency-path: source/go.mod

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Checkout web client source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/rustdesk-api-web
          path: source/rustdesk-api-web
          ref: master

      - name: Build admin web client assets
        working-directory: source/rustdesk-api-web
        run: |
          npm install
          npm run build
          mkdir -p ../resources/admin
          cp -ar dist/* ../resources/admin/

      - name: Download Go dependencies
        working-directory: source
        run: go mod download

      - name: Write version file
        working-directory: source
        run: echo "${{ needs.prepare.outputs.release-version }}" > resources/version

      - name: Generate Swagger docs
        working-directory: source
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/apimain.go --output docs/api --instanceName api --exclude http/controller/admin
          swag init -g cmd/apimain.go --output docs/admin --instanceName admin --exclude http/controller/api

      - name: Build archive
        working-directory: source
        run: |
          mkdir -p release/data release/runtime
          cp -ar resources release/
          cp -ar docs release/
          cp -ar conf release/

          if [ "${{ matrix.job.platform }}" = "arm64" ]; then
            wget https://musl.ljw.red/aarch64-linux-musl-cross.tgz
            tar -xf aarch64-linux-musl-cross.tgz
            export PATH="$PATH:$PWD/aarch64-linux-musl-cross/bin"
            GOOS=linux GOARCH=arm64 CC=aarch64-linux-musl-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 \
              go build -ldflags "-s -w" -o ./release/apimain ./cmd/apimain.go
          elif [ "${{ matrix.job.platform }}" = "armv7l" ]; then
            wget https://musl.ljw.red/armv7l-linux-musleabihf-cross.tgz
            tar -xf armv7l-linux-musleabihf-cross.tgz
            export PATH="$PATH:$PWD/armv7l-linux-musleabihf-cross/bin"
            GOOS=linux GOARCH=arm GOARM=7 CC=armv7l-linux-musleabihf-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 \
              go build -ldflags "-s -w" -o ./release/apimain ./cmd/apimain.go
          else
            sudo apt-get update
            sudo apt-get install -y musl musl-dev musl-tools
            GOOS=linux GOARCH=amd64 CC=musl-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 \
              go build -ldflags "-s -w" -o ./release/apimain ./cmd/apimain.go
          fi

          tar -czf "linux-${{ matrix.job.platform }}.${{ matrix.job.file_ext }}" ./release

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rustdesk-api-linux-${{ matrix.job.platform }}
          path: |
            source/linux-${{ matrix.job.platform }}.${{ matrix.job.file_ext }}

  deb-package:
    name: Debian package - ${{ matrix.job.name }}
    needs:
      - prepare
      - build-linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64", platform: "amd64", debian_platform: "amd64", crossbuild_package: "" }
          - { name: "arm64v8", platform: "arm64", debian_platform: "arm64", crossbuild_package: "crossbuild-essential-arm64" }
          - { name: "armv7", platform: "armv7l", debian_platform: "armhf", crossbuild_package: "crossbuild-essential-armhf" }

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-tag }}
          path: source

      - name: Set up QEMU
        if: ${{ matrix.job.platform != 'amd64' }}
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Create packaging env
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -y devscripts build-essential debhelper pkg-config ${{ matrix.job.crossbuild_package }}
          mkdir -p source/debian-build/${{ matrix.job.platform }}/bin

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: rustdesk-api-linux-${{ matrix.job.platform }}
          path: source

      - name: Unpack binaries
        run: |
          mkdir -p source/${{ matrix.job.platform }}
          tar -xzf source/linux-${{ matrix.job.platform }}.tar.gz -C source/${{ matrix.job.platform }}

      - name: Update changelog
        run: |
          DATE=$(date -R)
          sed -i "1i rustdesk-api-server (${{ needs.prepare.outputs.release-version }}) stable; urgency=medium\n\n  * Automatically generated release for version ${{ needs.prepare.outputs.release-version }}.\n\n -- GitHub Actions <actions@github.com>  ${DATE}\n" source/debian/changelog

      - name: Build package
        run: |
          chmod -v a+x source/${{ matrix.job.platform }}/release/*
          mv source/${{ matrix.job.platform }}/release/apimain source/debian-build/${{ matrix.job.platform }}/bin/rustdesk-api
          chmod -v a+x source/debian-build/${{ matrix.job.platform }}/bin/*
          mkdir -p source/data
          mkdir -p source/runtime
          cp -vr source/debian source/systemd source/conf source/data source/resources source/runtime source/debian-build/${{ matrix.job.platform }}/
          sed "s/{{ ARCH }}/${{ matrix.job.debian_platform }}/" source/debian/control.tpl > source/debian-build/${{ matrix.job.platform }}/debian/control
          cd source/debian-build/${{ matrix.job.platform }}/
          debuild -i -us -uc -b -a${{ matrix.job.debian_platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rustdesk-api-deb-${{ matrix.job.platform }}
          path: |
            source/debian-build/*.deb

  create-release:
    name: Create GitHub draft release
    needs: prepare
    runs-on: ubuntu-22.04

    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.prepare.outputs.release-tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: GitHub release - debian packages
    needs:
      - prepare
      - deb-package
      - create-release
    runs-on: ubuntu-22.04

    steps:
      - name: Download debian packages
        uses: actions/download-artifact@v8
        with:
          pattern: rustdesk-api-deb-*
          path: debs
          merge-multiple: true

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(debs/*.deb)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Debian packages found" >&2
            exit 1
          fi

          gh release upload "${{ needs.prepare.outputs.release-tag }}" \
            "${files[@]}" \
            --clobber \
            --repo "${{ github.repository }}"
