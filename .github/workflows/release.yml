name: release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to build, for example v1.2.3.
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "20"

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-22.04
    outputs:
      release-tag: ${{ steps.version.outputs.release-tag }}
      release-version: ${{ steps.version.outputs.release-version }}

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          version="${tag#v}"

          if [[ ! "${tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi

          echo "release-tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release-version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build release artifacts - ${{ matrix.job.goos }}-${{ matrix.job.platform }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { platform: "amd64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "arm64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "armv7l", goos: "linux", file_ext: "tar.gz" }
          - { platform: "amd64", goos: "windows", file_ext: "zip" }

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-tag }}
          path: source

      - name: Read Go version
        id: go-version
        working-directory: source
        run: |
          version="$(sed -n 's/^toolchain go//p' go.mod | head -n 1)"
          if [ -z "${version}" ]; then
            echo "Unable to determine Go version from go.mod" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache-dependency-path: source/go.mod

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Checkout web client source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/rustdesk-api-web
          path: source/rustdesk-api-web
          ref: master

      - name: Build admin web client assets
        working-directory: source/rustdesk-api-web
        run: |
          npm install
          npm run build
          mkdir -p ../resources/admin
          cp -ar dist/* ../resources/admin/

      - name: Download Go dependencies
        working-directory: source
        run: go mod download

      - name: Write version file
        working-directory: source
        run: echo "${{ needs.prepare.outputs.release-version }}" > resources/version

      - name: Generate Swagger docs
        working-directory: source
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/apimain.go --output docs/api --instanceName api --exclude http/controller/admin
          swag init -g cmd/apimain.go --output docs/admin --instanceName admin --exclude http/controller/api

      - name: Build archive
        working-directory: source
        run: |
          mkdir -p release/data release/runtime
          cp -ar resources release/
          cp -ar docs release/
          cp -ar conf release/

          if [ "${{ matrix.job.goos }}" = "windows" ]; then
            sudo apt-get update
            sudo apt-get install -y gcc-mingw-w64-x86-64 zip
            GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 \
              go build -ldflags "-s -w" -o ./release/apimain.exe ./cmd/apimain.go
            {
              echo '@echo off'
              echo 'cmd /c "%~dp0apimain.exe"'
            } > release/start.bat
            zip -r "${{ matrix.job.goos }}-${{ matrix.job.platform }}.${{ matrix.job.file_ext }}" ./release
            exit 0
          fi

          if [ "${{ matrix.job.platform }}" = "arm64" ]; then
            wget https://musl.ljw.red/aarch64-linux-musl-cross.tgz
            tar -xf aarch64-linux-musl-cross.tgz
            export PATH="$PATH:$PWD/aarch64-linux-musl-cross/bin"
            GOOS=linux GOARCH=arm64 CC=aarch64-linux-musl-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 \
              go build -ldflags "-s -w" -o ./release/apimain ./cmd/apimain.go
          elif [ "${{ matrix.job.platform }}" = "armv7l" ]; then
            wget https://musl.ljw.red/armv7l-linux-musleabihf-cross.tgz
            tar -xf armv7l-linux-musleabihf-cross.tgz
            export PATH="$PATH:$PWD/armv7l-linux-musleabihf-cross/bin"
            GOOS=linux GOARCH=arm GOARM=7 CC=armv7l-linux-musleabihf-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 \
              go build -ldflags "-s -w" -o ./release/apimain ./cmd/apimain.go
          else
            sudo apt-get update
            sudo apt-get install -y musl musl-dev musl-tools
            GOOS=linux GOARCH=amd64 CC=musl-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 \
              go build -ldflags "-s -w" -o ./release/apimain ./cmd/apimain.go
          fi

          tar -czf "${{ matrix.job.goos }}-${{ matrix.job.platform }}.${{ matrix.job.file_ext }}" ./release

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rustdesk-api-${{ matrix.job.goos }}-${{ matrix.job.platform }}
          path: |
            source/${{ matrix.job.goos }}-${{ matrix.job.platform }}.${{ matrix.job.file_ext }}

  release-notes:
    name: Generate release notes
    needs: prepare
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Read Go version
        id: go-version
        run: |
          version="$(sed -n 's/^toolchain go//p' go.mod | head -n 1)"
          if [ -z "${version}" ]; then
            echo "Unable to determine Go version from go.mod" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Generate release notes
        run: |
          go run ./cmd/release-notes \
            --tag "${{ needs.prepare.outputs.release-tag }}" \
            --repo-url "https://github.com/${{ github.repository }}" \
            --cwd "${GITHUB_WORKSPACE}" \
            --output release-notes.md \
            --release-date "$(date -u +%F)"

      - name: Upload release notes
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  create-release:
    name: Create GitHub draft release
    needs:
      - prepare
      - release-notes
    runs-on: ubuntu-22.04

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.prepare.outputs.release-tag }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: GitHub release - ${{ matrix.job.goos }}-${{ matrix.job.platform }}
    needs:
      - prepare
      - build
      - create-release
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { platform: "amd64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "arm64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "armv7l", goos: "linux", file_ext: "tar.gz" }
          - { platform: "amd64", goos: "windows", file_ext: "zip" }

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: rustdesk-api-${{ matrix.job.goos }}-${{ matrix.job.platform }}
          path: .

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare.outputs.release-tag }}" \
            "${{ matrix.job.goos }}-${{ matrix.job.platform }}.${{ matrix.job.file_ext }}" \
            --clobber \
            --repo "${{ github.repository }}"
